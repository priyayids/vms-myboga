server:
  port: 8080

spring:
  application:
    name: visitor-middleware
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/visitor_bridge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

nuveq:
  base-url: ${NUVEQ_BASE_URL:https://api-v2.nuveq.cloud}
  api-key: ${NUVEQ_API_KEY:}
  connect-timeout: 5s
  read-timeout: 10s
  max-retries: 3
  backoff-delay-ms: 500
  event-listener:
    # webhook = Nuveq POSTs to us (needs a publicly reachable URL, so it only works
    # once the service is deployed behind a domain). polling = we pull GET /api/events,
    # which is the only option for localhost/demo-device testing.
    mode: ${NUVEQ_EVENT_MODE:webhook} # webhook or polling
    polling-interval-ms: ${NUVEQ_POLL_INTERVAL_MS:10000}
    # Cap on remembered event ids; bounds memory on a long-running instance.
    processed-events-capacity: ${NUVEQ_PROCESSED_EVENTS_CAPACITY:5000}

vms:
  booking:
    expiry-minutes: 15
    operating-hours-start: 9
    operating-hours-end: 22
    timezone: Asia/Jakarta
  qr:
    # Resolved against the application working directory (the project root under
    # `mvn spring-boot:run`). Override with QR_STORAGE_PATH to point elsewhere.
    # Deliberately NOT under src/main/resources: Maven would package generated
    # images into the jar, and runtime writes would pollute the source tree.
    storage-path: ${QR_STORAGE_PATH:./data/qr-codes}
    base-serve-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
