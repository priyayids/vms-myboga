services:
  db:
    image: postgres:16-alpine
    container_name: visitor-db
    environment:
      POSTGRES_DB: visitor_bridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visitor_bridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: visitor-middleware-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/visitor_bridge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      NUVEQ_BASE_URL: ${NUVEQ_BASE_URL:-https://api-v2.nuveq.cloud}
      NUVEQ_API_KEY: ${NUVEQ_API_KEY:-mock-dev-key}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data/qr-codes:/app/data/qr-codes

volumes:
  pgdata:
